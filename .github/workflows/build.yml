name: Build SquadTalk APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Absolute System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev coreutils automake \
          autoconf libtool pkg-config libncurses5-dev libgdbm-dev \
          libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev \
          sqlite3 bzip2 libbz2-dev liblzma-dev texinfo lld unzip zip ccache gawk

    - name: Cache Buildozer Android SDK Frameworks
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install Stable Buildozer & Specific Cython
      run: |
        pip install --upgrade pip
        pip install "cython==0.29.37" buildozer

    - name: Compile Android Debug APK
      run: |
        # Forces Android SDK manager to auto-accept licenses globally
        export APP_ANDROID_ACCEPT_SDK_LICENSE=1
        buildozer android debug
        
    - name: Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SquadTalk-APK
        path: bin/*.apk
        
